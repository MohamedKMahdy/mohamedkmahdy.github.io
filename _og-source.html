<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @page { size: 1200px 630px; margin: 0; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    background:#09090b; color:#fff;
    background-image:radial-gradient(760px 420px at 88% -12%,rgba(255,255,255,.08),transparent 62%);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column; justify-content:center;
    padding:0 78px; position:relative;
  }
  .grid{display:none}
  .inner{position:relative}
  .eyebrow{display:inline-block;font-size:20px;font-weight:500;color:#e4e4e7;background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:7px 18px;margin-bottom:28px}
  h1{font-size:78px; line-height:1.02; letter-spacing:-.035em; font-weight:700; margin-bottom:16px}
  .role{font-size:28px;font-weight:500;color:#a1a1aa;margin-bottom:28px}
  .rule{display:none}
  .lede{font-size:29px; line-height:1.4; color:#e4e4e7; max-width:830px}
  .stats{position:absolute; left:78px; right:78px; bottom:52px; display:flex; gap:56px}
  .stat b{display:block;font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
  .stat span{font-size:16px;color:#a1a1aa}
</style></head>
<body>
  <div class="grid"></div>
  <div class="inner">
    <p class="eyebrow">Munich, Germany</p>
    <h1>Mohamed K. Mahdy</h1>
    <p class="role">BIM &amp; AI Solutions Architect</p>
    <div class="rule"></div>
    <p class="lede">I build software that makes BIM data usable, and lately, software that lets AI act on it.</p>
  </div>
  <div class="stats">
    <div class="stat"><b>~20</b><span>Tools shipped</span></div>
    <div class="stat"><b>5+</b><span>Years in AEC</span></div>
    <div class="stat"><b>895</b><span>Consulting hours</span></div>
    <div class="stat"><b>BIM · GIS · AI</b><span>Where I work</span></div>
  </div>
</body></html>
